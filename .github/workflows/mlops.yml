name: mlops-ci-cd

on:
  push:
    branches:
      - dev
      - prod

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ONNX model
        run: python scripts/download_model.py --url "${{ secrets.MODEL_URL }}" --output artifacts/model.onnx

      - name: Run unit tests
        env:
          MODEL_PATH: artifacts/model.onnx
          TEST_DATA_URL: ${{ secrets.TEST_DATA_URL }}
        run: pytest -q

  build-promote:
    name: build/promote
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose Hugging Face Space
        id: choose-space
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "space=${{ secrets.HF_SPACE_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "space=${{ secrets.HF_SPACE_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ steps.choose-space.outputs.space }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HF_TOKEN"          || (echo "Falta HF_TOKEN" && exit 1)
          test -n "$HF_USERNAME"       || (echo "Falta HF_USERNAME" && exit 1)
          test -n "$HF_SPACE"          || (echo "Falta HF_SPACE_DEV o HF_SPACE_PROD" && exit 1)
          test -n "$DOCKERHUB_USERNAME" || (echo "Falta DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN"   || (echo "Falta DOCKERHUB_TOKEN" && exit 1)

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mlops-iris:${{ github.ref_name }}
          docker build --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" -t $IMAGE .
          docker push $IMAGE
          echo "Imagen publicada: $IMAGE"

      - name: Set APP_ENV in Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ steps.choose-space.outputs.space }}
          APP_ENV: ${{ github.ref_name }}
        run: |
          pip install huggingface_hub -q
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.add_space_variable(
              repo_id=f"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE']}",
              key="APP_ENV",
              value=os.environ["APP_ENV"],
          )
          print(f"APP_ENV={os.environ['APP_ENV']} configurado en {os.environ['HF_USERNAME']}/{os.environ['HF_SPACE']}")
          EOF

      - name: Promote to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ steps.choose-space.outputs.space }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git remote add space "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE"
          git push --force space HEAD:main

      - name: Verify deployment
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ steps.choose-space.outputs.space }}
        run: |
          echo "Esperando que el Space inicie..."
          sleep 45
          curl -sf "https://$HF_USERNAME-$HF_SPACE.hf.space/health" \
            && echo "Deployment OK" \
            || echo "Space aun iniciando (normal en cold start)"
