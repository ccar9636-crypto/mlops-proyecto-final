name: mlops-ci-cd

on:
  push:
    branches:
      - dev
      - prod

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ONNX model
        run: python scripts/download_model.py --url "${{ secrets.MODEL_URL }}" --output artifacts/model.onnx

      - name: Run unit tests
        env:
          MODEL_PATH: artifacts/model.onnx
          TEST_DATA_URL: ${{ secrets.TEST_DATA_URL }}
        run: pytest -q

  build-promote:
    name: build/promote
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" -t mlops-iris:${{ github.ref_name }} .

      - name: Choose Hugging Face Space
        id: choose-space
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "space=${{ secrets.HF_SPACE_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "space=${{ secrets.HF_SPACE_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ steps.choose-space.outputs.space }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git remote add space "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE"
          git push --force space HEAD:main

